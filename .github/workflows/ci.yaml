name: 'ci'

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.github/dependabot.yaml'
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
    branches: [ '**' ]
  workflow_call:
    inputs:
      target-sha:
        description: Pinned commit SHA to test; defaults to the workflow context SHA
        required: false
        type: string
        default: ''

  # Allow manually trigger
  workflow_dispatch:

env:
  TAG_PREFIX: v
  PYTHON_VERSION: '3.12'

jobs:
  BuildAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: go build ./...
      - run: go test ./...
        env:
          CHEESESHOP_PIP_TEST: '1'

  PreviewRelease:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Preview release
        id: plan
        uses: btnguyen2k/action-semrelease@37fe196d36496098bd291e9519c86772ea2e0c0d # v5.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: true
          tag-prefix: ${{ env.TAG_PREFIX }}
          target-sha: ${{ inputs.target-sha || github.sha }}
          branches: ${{ github.ref_name }}

  BuildAndTestDocker:
    needs: [ BuildAndTest ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          fetch-depth: 0
      - name: Build Docker image
        id: docker_build
        uses: btnguyen2k/gh-actions/dockerbp@dockerbp/v0.3.0
        with:
          target-sha: ${{ inputs.target-sha || github.sha }}
          image: cheeseshop
          tags: ci
          platforms: ${{ matrix.platform }}
          dockerfile: Dockerfile
          context: ./
          mode: build
          publish: local
      - name: Smoke test Docker image
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8080:8080 cheeseshop:ci)"
          trap 'docker logs "$container_id"; docker rm --force --volumes "$container_id"' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 1 --retry-connrefused --retry-max-time 30 \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --max-time 10 \
            --header 'Accept: application/vnd.pypi.simple.v1+json' \
            http://127.0.0.1:8080/simple/ |
            python3 -c 'import json, sys; assert json.load(sys.stdin)["projects"] == []'
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 10 http://127.0.0.1:8080/simple/not-approved/)"
          test "$status" = 404

name: 'ci'

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.github/dependabot.yaml'
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
    branches: [ '**' ]
  workflow_call:
    inputs:
      target-sha:
        description: Pinned commit SHA to test; defaults to the workflow context SHA
        required: false
        type: string
        default: ''

  # Allow manually trigger
  workflow_dispatch:

env:
  TAG_PREFIX: v
  DOCKER_IMAGE: btnguyen2k/cheeseshop-proxy # update your Docker Hub image name here
  PYTHON_VERSION: '3.12'

jobs:
  # # Check out the event SHA (synthetic merge on PRs), or an explicit target-sha.
  # # Standalone PR previews use base history/metadata, not the proposed PR changes.
  # # A caller's full 40-character SHA overrides both checkout and preview targets.
  # PinCommitSHA:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     target-sha: ${{ steps.capture.outputs.target-sha }}
  #     action-target-sha: ${{ steps.capture.outputs.action-target-sha }}
  #     action-branch: ${{ steps.capture.outputs.action-branch }}
  #   steps:
  #     - name: Capture pinned commit SHA
  #       id: capture
  #       shell: bash
  #       env:
  #         TARGET_SHA: ${{ inputs.target-sha || github.sha }}
  #         PR_BASE_SHA: ${{ !inputs.target-sha && github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  #         ACTION_BRANCH: ${{ github.base_ref || github.ref_name }}
  #       run: |
  #         if [[ ! "$TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
  #           echo "❌target-sha must be a full 40-character commit SHA"
  #           exit 1
  #         fi
  #         ACTION_TARGET_SHA="${PR_BASE_SHA:-$TARGET_SHA}"
  #         if [[ ! "$ACTION_TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
  #           echo "❌Action target must be a full 40-character commit SHA"
  #           exit 1
  #         fi
  #         printf 'target-sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
  #         printf 'action-target-sha=%s\n' "$ACTION_TARGET_SHA" >> "$GITHUB_OUTPUT"
  #         printf 'action-branch=%s\n' "$ACTION_BRANCH" >> "$GITHUB_OUTPUT"
  #         printf '✅Successfully captured pinned commit SHA:\n- target-sha=%s\n- action-target-sha=%s\n- action-branch=%s\n' "$TARGET_SHA" "$ACTION_TARGET_SHA" "$ACTION_BRANCH"

  BuildAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: go build ./...
      - run: go test ./...
        env:
          CHEESESHOP_PIP_TEST: '1'

  PreviewRelease:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Preview release
        id: plan
        uses: btnguyen2k/action-semrelease@37fe196d36496098bd291e9519c86772ea2e0c0d # v5.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: true
          tag-prefix: ${{ env.TAG_PREFIX }}
          target-sha: ${{ inputs.target-sha || github.sha }}
          branches: ${{ github.ref_name }}

  BuildAndTestDocker:
    needs: [ BuildAndTest ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          fetch-depth: 0
      - name: Build Docker image
        id: docker_build
        uses: btnguyen2k/gh-actions/dockerbp@dockerbp/v0.3.0
        with:
          target-sha: ${{ inputs.target-sha || github.sha }}
          image: cheeseshop
          tags: ci
          platforms: ${{ matrix.platform }}
          dockerfile: Dockerfile
          context: ./
          mode: build
          publish: local
      - name: Smoke test Docker image
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8080:8080 cheeseshop:ci)"
          trap 'docker logs "$container_id"; docker rm --force --volumes "$container_id"' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 1 --retry-connrefused --retry-max-time 30 \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --max-time 10 \
            --header 'Accept: application/vnd.pypi.simple.v1+json' \
            http://127.0.0.1:8080/simple/ |
            python3 -c 'import json, sys; assert json.load(sys.stdin)["projects"] == []'
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 10 http://127.0.0.1:8080/simple/not-approved/)"
          test "$status" = 404

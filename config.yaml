# Shared configuration for native runs and Docker.
# Docker includes this file at /config/config.yaml. Restart after changing it.
# Precedence: built-in defaults < this file < CHEESESHOP_* environment variables.
# Unset variables preserve YAML values. Empty values are validated, not ignored;
# an empty CHEESESHOP_ALLOW explicitly clears the allowlist.
# Durations use Go syntax, such as 30s, 5m, or 2h, and must be positive.

# Bind all interfaces so Docker's published port can reach the service.
# For local-only native access, use "127.0.0.1:8080" (the default when omitted).
# Environment: CHEESESHOP_LISTEN
listen: "0.0.0.0:8080"

# Required: the externally reachable base URL, optionally including a path prefix.
# Do not append /simple/. Use HTTPS behind a TLS-terminating ingress for shared
# deployments; HTTP is for local development.
# Environment: CHEESESHOP_PUBLIC_BASE_URL
public_base_url: "http://localhost:8080"

# PyPI project names, literal prefixes ending in *, or "*" to allow all projects.
# Names are lowercased and runs of ., _, and - become a single -.
# For example: allow: ["requests", "company-*"]
# An empty list exposes no packages; excluded projects return 404, not 403.
# Matching a name allows all versions. Runtime/build dependencies need matches.
# Regexes and non-terminal wildcards are not supported. Block rules are deferred.
# Environment: CHEESESHOP_ALLOW="requests,company-*" replaces this list.
# Spaces around comma-separated patterns are trimmed; empty patterns are invalid.
allow: []

cache:
  # Dedicated writable directory, owned by only one proxy process.
  # Relative to the process working directory, not this configuration file:
  # native runs use .cache under that directory; Docker uses /data/.cache.
  # Environment: CHEESESHOP_CACHE_DIR
  dir: ".cache"

  # Logical cache-file budget in bytes, including metadata and active downloads.
  # Filesystem overhead and the small URL-signing key are outside this budget.
  # Environment: CHEESESHOP_CACHE_MAX_BYTES (base-10 integer)
  max_bytes: 1073741824 # 1 GiB

  # Maximum downloaded object size in bytes, including indexes and distributions.
  # Increase this and max_bytes together if you need larger Python wheels.
  # Must be positive; max_bytes must leave at least 64 KiB extra for metadata.
  # Environment: CHEESESHOP_CACHE_MAX_OBJECT_BYTES (base-10 integer)
  max_object_bytes: 134217728 # 128 MiB

  # Revalidation interval for project lists and project/file metadata.
  # Distributions and their metadata sidecars persist until evicted.
  # Environment: CHEESESHOP_CACHE_METADATA_TTL (Go duration, e.g. 5m)
  metadata_ttl: 5m

upstream:
  # Deadline per cache fetch, including concurrency waits and body downloads.
  # The upstream is fixed to public PyPI and is not configured here.
  # Environment: CHEESESHOP_UPSTREAM_TIMEOUT (Go duration, e.g. 2m)
  timeout: 2m

  # Positive limit on simultaneous upstream requests, including body downloads.
  # Requests for the same cached object share one upstream fetch.
  # Environment: CHEESESHOP_UPSTREAM_MAX_CONCURRENT (base-10 integer)
  max_concurrent: 8
